services:
  personal-time-tracker:
    container_name: personal-time-tracker
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      # Bind to localhost only — the app is reached through nginx (or http://localhost:3001
      # on your dev machine), never directly from the public internet.
      - "127.0.0.1:3001:3000"
    # DATABASE_URL is read from .env.docker (gitignored) — it's your .env.local with the
    # host swapped from localhost to host.docker.internal so the container reaches the
    # PostgreSQL running on your host. The host Postgres must accept connections from the
    # Docker network (postgresql.conf listen_addresses + pg_hba.conf).
    env_file:
      - .env.docker
    environment:
      # Make the Next.js standalone server bind to all interfaces inside the container.
      - HOSTNAME=0.0.0.0
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
